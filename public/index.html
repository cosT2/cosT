<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="英语六级复习工作台，包含学习日历、单词复习、真题模拟和学习报告。" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css?v=20261004-account-1" />
    <title>六级复习工作台</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <!-- 登录 / 注册 -->
    <div class="auth-screen" id="auth-screen" hidden>
      <div class="auth-card">
        <div class="auth-brand">
          <div class="brand-mark" aria-hidden="true">6</div>
          <h1>六级复习工作台</h1>
          <p>登录后开始今天的学习。</p>
        </div>
        <form class="auth-form" id="auth-form">
          <div class="field">
            <label for="auth-username">账号</label>
            <input id="auth-username" name="username" type="text" autocomplete="username" placeholder="8–32 位字母或数字" minlength="8" maxlength="32" pattern="[A-Za-z0-9]{8,32}" required />
          </div>
          <div class="field">
            <label for="auth-password">密码</label>
            <input id="auth-password" name="password" type="password" autocomplete="current-password" placeholder="至少 6 位" maxlength="128" required />
          </div>
          <div class="field" id="auth-confirm-field" hidden>
            <label for="auth-confirm-password">确认密码</label>
            <input id="auth-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" maxlength="128" disabled />
          </div>
          <button class="button button-primary auth-submit" id="auth-submit" type="submit">登 录</button>
          <div class="auth-switch"><span id="auth-switch-copy">还没有账号？</span><button type="button" class="text-button" id="auth-toggle">注册一个</button></div>
          <p class="auth-error" id="auth-error" role="alert" hidden></p>
          <p class="card-note">学习记录将保存在你的账号中。已有浏览器记录可先导出备份，再登录导入；暂不提供邮箱找回密码，请妥善保存账号与密码。</p>
        </form>
      </div>
    </div>

    <div class="app-shell" id="app-shell" hidden>
      <aside class="sidebar" id="sidebar" aria-label="主导航">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">6</div>
          <div>
            <div class="brand-name">六级复习</div>
            <div class="brand-caption">STUDY DESK</div>
          </div>
        </div>

        <div class="sidebar-label">工作台</div>
        <nav class="nav-list">
          <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span><span>今日</span></button>
          <button class="nav-item" data-view="planner"><span class="nav-icon">▦</span><span>学习日历</span></button>
          <button class="nav-item" data-view="words"><span class="nav-icon">Aa</span><span>单词复习</span></button>
          <button class="nav-item" data-view="simulation"><span class="nav-icon">◷</span><span>整套模拟</span></button>
          <button class="nav-item" data-view="reports"><span class="nav-icon">↗</span><span>学习报告</span></button>
          <button class="nav-item" data-view="resources"><span class="nav-icon">▤</span><span>学习资料</span></button>
        </nav>

        <div class="sidebar-bottom">
          <div class="local-status"><span class="status-dot"></span><span id="save-status">已保存</span></div>
          <div class="user-chip" id="user-chip">
            <span class="user-avatar" id="user-avatar" aria-hidden="true"></span>
            <span class="user-name" id="user-name"></span>
            <button class="text-button" id="logout-button" type="button">退出</button>
          </div>
          <div class="sidebar-version">v2.0</div>
        </div>
      </aside>

      <div class="app-main">
        <header class="topbar">
          <div class="topbar-left">
            <button class="icon-button mobile-menu" data-action="toggle-sidebar" aria-label="打开导航">☰</button>
            <div class="crumb" id="breadcrumb">今日 / 学习概览</div>
          </div>
          <div class="topbar-actions">
            <div class="sync-chip"><span class="status-dot"></span><span id="topbar-save-status">已保存</span></div>
            <button class="button button-secondary top-action" data-view="planner">调整计划</button>
          </div>
        </header>

        <main id="main-content" class="main-content" tabindex="-1"></main>
      </div>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

    <div id="auth-loading" class="auth-loading"><span></span></div>

    <script type="module" src="/app.js?v=20261004-account-1"></script>
  </body>
</html>
