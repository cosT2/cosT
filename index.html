<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="英语六级复习工作台，包含学习日历、单词复习、真题模拟和学习报告。" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css?v=20261004-media-1" />
    <title>六级复习工作台</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <div class="app-shell" id="app-shell" hidden>
      <aside class="sidebar" id="sidebar" aria-label="主导航">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">6</div>
          <div>
            <div class="brand-name">六级复习</div>
            <div class="brand-caption">STUDY DESK</div>
          </div>
        </div>

        <div class="sidebar-label">工作台</div>
        <nav class="nav-list">
          <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span><span>今日</span></button>
          <button class="nav-item" data-view="planner"><span class="nav-icon">▦</span><span>学习日历</span></button>
          <button class="nav-item" data-view="words"><span class="nav-icon">Aa</span><span>单词复习</span></button>
          <button class="nav-item" data-view="simulation"><span class="nav-icon">◷</span><span>整套模拟</span></button>
          <button class="nav-item" data-view="reports"><span class="nav-icon">↗</span><span>学习报告</span></button>
          <button class="nav-item" data-view="resources"><span class="nav-icon">▤</span><span>学习资料</span></button>
        </nav>

        <div class="sidebar-bottom">
          <div class="local-status"><span class="status-dot"></span><span id="save-status">已保存</span></div>
          <div class="user-chip" id="user-chip">
            <span class="user-avatar" id="user-avatar" aria-hidden="true"></span>
            <span class="user-name" id="user-name"></span>
          </div>
          <div class="sidebar-version">v2.0</div>
        </div>
      </aside>

      <div class="app-main">
        <header class="topbar">
          <div class="topbar-left">
            <button class="icon-button mobile-menu" data-action="toggle-sidebar" aria-label="打开导航">☰</button>
            <div class="crumb" id="breadcrumb">今日 / 学习概览</div>
          </div>
          <div class="topbar-actions">
            <div class="sync-chip"><span class="status-dot"></span><span id="topbar-save-status">已保存</span></div>
            <button class="button button-secondary top-action" data-view="planner">调整计划</button>
          </div>
        </header>

        <p class="static-notice" style="margin:16px 32px 0;color:#526078;line-height:1.7;font-size:14px">学习记录保存在当前浏览器，请定期导出备份。听力已上线，个别试卷仍有内容缺口。</p>
        <main id="main-content" class="main-content" tabindex="-1"></main>
      </div>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

    <div id="auth-loading" class="auth-loading"><span></span></div>

    <script type="module" src="./app.js?v=20261004-media-1"></script>
  </body>
</html>
